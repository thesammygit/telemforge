name: Public Repo Guard

on:
  push:
  pull_request:

jobs:
  public-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan for private material
        run: python3 scripts/public_repo_guard.py --scan-history
