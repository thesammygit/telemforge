services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: telemforge-backend:local
    ports:
      - "8000:8000"
    volumes:
      - telemforge_backend_data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: telemforge-frontend:local
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000

volumes:
  telemforge_backend_data:
